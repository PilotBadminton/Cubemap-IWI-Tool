<svg xmlns="http://www.w3.org/2000/svg" width="960" height="536" viewBox="0 0 960 536" role="img">
  <title>Cross atlas layout</title>
  <desc>Face arrangement, dimensions and outer gutter</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#586977" />
    </marker>
  </defs>
  <g font-family="Segoe UI">
    <rect x="1" y="1" width="958" height="534" rx="12" fill="#F7F9FA" stroke="#D7E0E6" />
    <text x="28" y="43" font-size="28" fill="#243441" font-weight="600" text-anchor="start">Cross atlas layout</text>
    <text x="28" y="76" font-size="18" fill="#586977" font-weight="400" text-anchor="start">Face arrangement, dimensions and outer gutter</text>
    <rect x="24" y="100" width="568" height="410" rx="8" fill="white" stroke="#CBD5DC" />
    <rect x="608" y="100" width="328" height="410" rx="8" fill="white" stroke="#CBD5DC" />
    <rect x="54" y="148" width="432" height="332" rx="0" fill="#E9EEF1" stroke="#146F7C" stroke-width="1.5" />
    <line x1="54" y1="128" x2="486" y2="128" stroke="#586977" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="54" y1="133" x2="54" y2="148" stroke="#586977" stroke-width="1" />
    <line x1="486" y1="133" x2="486" y2="148" stroke="#586977" stroke-width="1" />
    <text x="270" y="120" font-size="19" fill="#586977" font-weight="400" text-anchor="middle">4N + 2G</text>
    <line x1="526" y1="148" x2="526" y2="480" stroke="#586977" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="486" y1="148" x2="520" y2="148" stroke="#586977" stroke-width="1" />
    <line x1="486" y1="480" x2="520" y2="480" stroke="#586977" stroke-width="1" />
    <text x="552" y="314.0" font-size="19" fill="#586977" font-weight="400" text-anchor="middle" transform="rotate(90 552 314.0)">3N + 2G</text>
    <rect x="170" y="164" width="100" height="100" rx="0" fill="#E8EFF8" stroke="#8EA5B0" stroke-width="1.5" />
    <text x="220.0" y="224.0" font-size="30" fill="#243441" font-weight="600" text-anchor="middle">up</text>
    <rect x="70" y="264" width="100" height="100" rx="0" fill="#EEEAF5" stroke="#8EA5B0" stroke-width="1.5" />
    <text x="120.0" y="324.0" font-size="30" fill="#243441" font-weight="600" text-anchor="middle">lf</text>
    <rect x="170" y="264" width="100" height="100" rx="0" fill="#DDEFEA" stroke="#146F7C" stroke-width="1.5" />
    <text x="220.0" y="324.0" font-size="30" fill="#243441" font-weight="600" text-anchor="middle">ft</text>
    <rect x="270" y="264" width="100" height="100" rx="0" fill="#E5F0F3" stroke="#8EA5B0" stroke-width="1.5" />
    <text x="320.0" y="324.0" font-size="30" fill="#243441" font-weight="600" text-anchor="middle">rt</text>
    <rect x="370" y="264" width="100" height="100" rx="0" fill="#EBEEE4" stroke="#8EA5B0" stroke-width="1.5" />
    <text x="420.0" y="324.0" font-size="30" fill="#243441" font-weight="600" text-anchor="middle">bk</text>
    <rect x="170" y="364" width="100" height="100" rx="0" fill="#F5EDDF" stroke="#8EA5B0" stroke-width="1.5" />
    <text x="220.0" y="424.0" font-size="30" fill="#243441" font-weight="600" text-anchor="middle">dn</text>
    <rect x="54" y="148" width="16" height="16" rx="0" fill="#E7BD8F" stroke="#B86527" />
    <line x1="82" y1="153" x2="110" y2="148" stroke="#B86527" stroke-width="1.5" />
    <text x="117" y="154" font-size="20" fill="#B86527" font-weight="600" text-anchor="start">G</text>
    <text x="632" y="140" font-size="19" fill="#586977" font-weight="400" text-anchor="start">Face size</text>
    <text x="632" y="184" font-size="30" fill="#243441" font-weight="600" text-anchor="start">N × N</text>
    <line x1="632" y1="207" x2="912" y2="207" stroke="#CBD5DC" stroke-width="1.5" />
    <text x="632" y="242" font-size="19" fill="#586977" font-weight="400" text-anchor="start">Outer gutter</text>
    <text x="632" y="282" font-size="27" fill="#B86527" font-weight="600" text-anchor="start">G ≥ 0</text>
    <line x1="632" y1="305" x2="912" y2="305" stroke="#CBD5DC" stroke-width="1.5" />
    <text x="632" y="342" font-size="19" fill="#586977" font-weight="400" text-anchor="start">Face slots</text>
    <text x="632" y="380" font-size="23" fill="#243441" font-weight="600" text-anchor="start">rt · lf · up</text>
    <text x="632" y="416" font-size="23" fill="#243441" font-weight="600" text-anchor="start">dn · ft · bk</text>
    <text x="632" y="474" font-size="18" fill="#586977" font-weight="400" text-anchor="start">All faces are square</text>
